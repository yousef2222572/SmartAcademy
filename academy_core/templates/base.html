{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" class="h-100" dir="ltr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% trans 'Smart academy' %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script defer src="{% static 'js/830.66d67bb4.js' %}"></script>
  <script defer src="{% static 'js/app.2fe33112.js' %}"></script>
  <link href="{% static 'css/830.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  <link
  rel="stylesheet"href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>

<body class="d-flex flex-column h-100 bg-light">
  <div class="site-layout">
    {% include 'partials/header.html' %}

    <button class="sidebar-open-btn" type="button" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="sidebar-backdrop"></div>

    <div class="site-content">
      <main>
        {% block content %}
        {% endblock %}
      </main>
      {% include 'partials/footer.html' %}
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/lesson.js' %}"></script>
    <script src="{% static 'js/stripe.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>

</html>

<style> 
  @media (max-width: 820px) {
    .site-layout {
      grid-template-columns: 72px minmax(0, 1fr);
    }
  }
  .bt-color{
      background: #2f2f2f !important;

      border-radius:15px;
      border: none;
    }

  .site-layout {
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 100vh;
    transition: grid-template-columns .2s ease;
  }

  .header-shell {
    display: contents;
  }

  .header-nav {
    grid-column: 2;
    grid-row: 1;
    min-width: 0;
  }

  .site-layout .chat-sidebar {
    grid-column: 1;
    grid-row: 1 / 3;
  }

  .site-layout.sidebar-collapsed {
    grid-template-columns: 72px minmax(0, 1fr);
  }

  .site-content {
    display: flex;
    grid-column: 2;
    grid-row: 2;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .site-content main {
    flex: 1;
  }

  @media (max-width: 600px) {
    /* Content uses the full width -- the sidebar becomes an overlay drawer */
    .site-layout,
    .site-layout.sidebar-collapsed {
      display: block;
      padding-left: 0;
    }

    .header-shell {
      display: block;
    }

    .header-nav {
      min-width: auto;
      padding-left: 4rem; /* keeps content clear of the floating menu button */
    }

    .chat-sidebar {
      transition: transform .25s ease, visibility .25s ease;
    }

    /* CLOSED -> completely off-canvas, nothing left on screen */
    .site-layout.sidebar-collapsed .chat-sidebar {
      width: 264px;
      flex-basis: 264px;
      transform: translateX(-100%);
      visibility: hidden;
      box-shadow: none;
    }

    /* OPEN -> slides in over the content */
    .site-layout.sidebar-expanded .chat-sidebar {
      transform: translateX(0);
      visibility: visible;
      z-index: 60;
      box-shadow: 0 0 45px rgba(0, 0, 0, .65);
    }

    .site-layout.sidebar-expanded .sidebar-toggle {
      width: 40px;
      height: 40px;
      margin-left: auto;
      margin-right: .8rem;
    }
  }

  /* Hidden by default, only shown on phones */
  .sidebar-open-btn,
  .sidebar-backdrop {
    display: none;
  }

  @media (max-width: 600px) {
    .sidebar-open-btn {
      display: grid;
      place-items: center;
      position: fixed;
      top: .7rem;
      left: .7rem;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: #101217;
      color: #e9ebef;
      cursor: pointer;
      box-shadow: 0 6px 20px -8px rgba(0, 0, 0, .8);
    }

    .sidebar-open-btn svg {
      width: 22px;
      height: 22px;
    }

    /* While the drawer is open the close button takes over */
    .site-layout.sidebar-expanded .sidebar-open-btn {
      display: none;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(0, 0, 0, .5);
    }

    .site-layout.sidebar-expanded .sidebar-backdrop {
      display: block;
    }
  }

  /* ---------- smaller typography on phones ---------- */
  @media (max-width: 600px) {
    html {
      font-size: 13.5px; /* was 16px -- scales every rem-based size */
    }

    body {
      font-size: .95rem;
      line-height: 1.55;
    }

    h1, .h1 { font-size: 1.45rem; }
    h2, .h2 { font-size: 1.25rem; }
    h3, .h3 { font-size: 1.10rem; }
    h4, .h4 { font-size: 1.00rem; }
    h5, .h5 { font-size: .92rem;  }
    h6, .h6 { font-size: .85rem;  }

    p, li, td, th, label, .btn, .nav-link, .dropdown-item {
      font-size: .875rem;
    }

    .form-control,
    .form-select {
      font-size: .875rem;
      padding: .4rem .6rem;
    }

    .card-body {
      padding: 1rem;
    }

    .container,
    .container-fluid {
      padding-left: .75rem;
      padding-right: .75rem;
    }

    .table {
      font-size: .8rem;
    }
  }
</style>
