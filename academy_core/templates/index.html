{% extends 'base.html' %}
{% load i18n %}

{% block content %}


<div class="homepage-sections">

  {% include 'partials/slider.html' %}

    <section class="category-section">
      <div class="container py-5">




        <!-- courses -->
        <div class="row g-4">
          {% for course in courses %}
            <div class="col-6 col-lg-3">
              {% include 'common/course_card.html' with course=course %}
            </div>
          {% endfor %}
        </div>

      </div>
    </section>

</div>
<style>
  .category-section:nth-child(even) {
    background: #f1f6f9;
  }

  /* Category banner */
  .category-banner {
    position: relative;
    width: 100%;
    height: 280px;
    overflow: hidden;
    background: #333e48;
    border-radius: 8px;
  }

  /* Banner image */
  .category-banner img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Dark overlay + content */
  .category-banner-content {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;

    gap: 1rem;
    padding: 2rem;

    color: white;

    background: linear-gradient(
      90deg,
      rgba(0, 0, 0, 0.72) 0%,
      rgba(0, 0, 0, 0.35) 45%,
      rgba(0, 0, 0, 0.05) 100%
    );
  }

  .category-banner-content h2 {
    margin: 0;
    font-size: clamp(1.75rem, 4vw, 3rem);
    font-weight: 700;
  }

  /* Courses */
  .category-section .course {
    margin-bottom: 0 !important;
  }

  /* Mobile */
  @media (max-width: 767px) {
    .category-banner {
      height: 220px;
    }

    .category-banner-content {
      padding: 1.5rem;
    }
  }
</style>
{% endblock %}
