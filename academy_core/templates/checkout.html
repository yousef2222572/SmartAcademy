{% extends 'base.html' %}

{% block content %}

{% include 'common/page_title.html' with title='Checkout' %}

<div class="container my-5">

    <div class="row g-4">

        <!-- Order Summary -->
        <div class="col-12">

            <div class="card border-0 shadow-sm">
                <div class="card-body">

                    <div class="alert alert-success text-center mb-0">
                        <h3 class="mb-0">
                            buy course 
                        </h3>


                    </div>

                </div>
            </div>

        </div>


        <!-- User Information -->
        <div class="col-12">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h4 class="mb-4">
                        Your information
                    </h4>

                    <form id="form-user-info">

                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label
                                    for="firstNameInput"
                                    class="form-label"
                                >
                                    First name
                                </label>

                                <input
                                    id="firstNameInput"
                                    class="form-control"
                                    type="text"
                                    value="{{ user.first_name }}"
                                    readonly
                                >

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="lastNameInput"
                                    class="form-label"
                                >
                                    Last name
                                </label>

                                <input
                                    id="lastNameInput"
                                    class="form-control"
                                    type="text"
                                    value="{{ user.last_name }}"
                                    readonly
                                >

                            </div>


                            <div class="col-12">

                                <label
                                    for="emailInput"
                                    class="form-label"
                                >
                                    Email
                                </label>

                                <input
                                    id="emailInput"
                                    class="form-control"
                                    type="email"
                                    value="{{ user.email }}"
                                    readonly
                                >

                            </div>


                            <!-- Phone -->
                            <div class="col-md-6">

                                <div class="wrap">

                                    <label class="label">
                                        Phone number
                                    </label>

                                    <div
                                        class="phone-wrap"
                                        id="phone-wrap"
                                    >

                                        <div class="input-row">

                                            <button
                                                class="country-trigger"
                                                id="country-trigger"
                                                type="button"
                                                aria-haspopup="listbox"
                                                aria-expanded="false"
                                            >

                                                <span
                                                    class="trigger-flag"
                                                    id="trigger-flag"
                                                ></span>

                                                <span
                                                    class="trigger-dial"
                                                    id="trigger-dial"
                                                >
                                                    +1
                                                </span>

                                                <svg
                                                    class="chevron"
                                                    width="11"
                                                    height="11"
                                                    viewBox="0 0 24 24"
                                                    fill="none"
                                                    stroke="currentColor"
                                                    stroke-width="2.5"
                                                >
                                                    <polyline points="6 9 12 15 18 9"/>
                                                </svg>

                                            </button>


                                            <input
                                                name="phone_number"
                                                class="phone-input"
                                                id="phone-input"
                                                type="tel"
                                                placeholder="(555) 123-4567"
                                                autocomplete="tel"
                                            >

                                            <span
                                                class="status-icon"
                                                id="status-icon"
                                            ></span>

                                        </div>


                                        <div
                                            class="dropdown"
                                            id="dropdown"
                                            role="listbox"
                                            aria-label="Select country"
                                        >

                                            <div class="search-wrap">

                                                <svg
                                                    width="13"
                                                    height="13"
                                                    viewBox="0 0 24 24"
                                                    fill="none"
                                                    stroke="currentColor"
                                                    stroke-width="2.2"
                                                    stroke-linecap="round"
                                                >
                                                    <circle cx="11" cy="11" r="8"/>
                                                    <line
                                                        x1="21"
                                                        y1="21"
                                                        x2="16.65"
                                                        y2="16.65"
                                                    />
                                                </svg>

                                                <input
                                                    class="search-input"
                                                    id="search-input"
                                                    type="text"
                                                    placeholder="Search country or code..."
                                                    autocomplete="off"
                                                >

                                            </div>


                                            <div
                                                class="country-list"
                                                id="country-list"
                                            ></div>

                                        </div>

                                    </div>


                                    <div
                                        class="intl-row"
                                        id="intl-row"
                                    >

                                        <span class="intl-label">
                                            International:
                                        </span>

                                        <span
                                            class="intl-number"
                                            id="intl-number"
                                        >
                                            --
                                        </span>

                                        <button
                                            class="copy-btn"
                                            id="copy-btn"
                                            type="button"
                                        >

                                            <svg
                                                width="13"
                                                height="13"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2.2"
                                                stroke-linecap="round"
                                            >
                                                <rect
                                                    x="9"
                                                    y="9"
                                                    width="13"
                                                    height="13"
                                                    rx="2"
                                                />

                                                <path
                                                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                                                />
                                            </svg>

                                            <span id="copy-label">
                                                Copy
                                            </span>

                                        </button>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </form>
                <h3 class="mt-2 mb-0">
                    total price {{course.price}}$
                </h3>
                <h3 class="mt-2 mb-0">
                    course name {{course.course_name}}

                </h3>
                </div>

            </div>

        </div>

          <a

              id="checkout-btn"
              data-course-id="{{ course.id }}"
              class="btn btn-secondary"
          >

          </a>


      <div class="col-12">

          <h4 class="mb-3">
              Payment Method
          </h4>

          <div class="row g-3">




              <!-- Stripe -->
              <div class="col-md-6">

                  <div
                      class="card payment-method"
                      role="button"
                      onclick="createStripeSession()"
                  >

                      <div class="card-body text-center py-4">

                          <p class="mb-2 fw-semibold">
                              Credit Card
                          </p>

                          <i class="lni lni-credit-cards fs-1"></i>

                      </div>

                  </div>

              </div>

          </div>


          <!-- Stripe Payment -->
          <div
              id="stripe-card"
              class="card border-0 shadow-sm p-3 mt-3"
              style="display: none;"
          >

              <form id="payment-form">

                  <div id="payment-element"></div>

                  <button
                      type="submit"
                      id="stripe-submit"
                      class="btn btn-primary mt-3 w-100"
                  >
                      Pay Now
                  </button>

              </form>

          </div>


          <!-- PayPal Payment -->
          <div
              id="paypal-card"
              class="card border-0 shadow-sm p-3 mt-3"
              style="display: none;"
          ></div>

      </div>



        </div>

    </div>

</div>


<style>

* {
    box-sizing: border-box;
}

.wrap {
    width: 100%;
    max-width: 340px;
}

.label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
}

.phone-wrap {
    position: relative;
}

.input-row {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    position: relative;
    transition: border-color 0.15s;
}

.input-row:focus-within {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.country-trigger {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 10px 10px 10px 12px;
    background: transparent;
    border: none;
    border-right: 1.5px solid #e2e8f0;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 10px 0 0 10px;
}

.country-trigger:hover {
    background: #f8fafc;
}

.country-trigger.open {
    background: rgba(99, 102, 241, 0.06);
    border-color: #a5b4fc;
}

.trigger-flag {
    font-size: 20px;
    line-height: 1;
}

.trigger-dial {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    min-width: 28px;
}

.chevron {
    color: #94a3b8;
    flex-shrink: 0;
    transition: transform 0.2s;
}

.country-trigger.open .chevron {
    transform: rotate(180deg);
}

.phone-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 10px 8px;
    font-size: 15px;
    color: #0f172a;
    background: transparent;
    font-family: inherit;
    min-width: 0;
}

.phone-input::placeholder {
    color: #94a3b8;
}

.status-icon {
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
}

.dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 100%;
    background: #fff;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    z-index: 200;
    opacity: 0;
    transform: scale(0.97) translateY(-4px);
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
}

.dropdown.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
}

.search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #f1f5f9;
}

.search-wrap svg {
    color: #94a3b8;
    flex-shrink: 0;
}

.search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 13px;
    color: #374151;
    font-family: inherit;
    background: transparent;
}

.search-input::placeholder {
    color: #94a3b8;
}

.country-list {
    max-height: 220px;
    overflow-y: auto;
    padding: 4px 0;
}

.country-list::-webkit-scrollbar {
    width: 4px;
}

.country-list::-webkit-scrollbar-track {
    background: transparent;
}

.country-list::-webkit-scrollbar-thumb {
    background: #e2e8f0;
    border-radius: 4px;
}

.country-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    transition: background 0.1s;
}

.country-item:hover,
.country-item.active {
    background: #f8fafc;
}

.country-item.selected {
    background: rgba(99, 102, 241, 0.07);
}

.country-flag {
    font-size: 18px;
    flex-shrink: 0;
    line-height: 1;
}

.country-name {
    flex: 1;
    font-size: 13px;
    color: #374151;
}

.country-code {
    font-size: 12px;
    font-weight: 600;
    color: #6366f1;
    min-width: 36px;
    text-align: right;
}

.no-results {
    padding: 16px 14px;
    font-size: 13px;
    color: #94a3b8;
    text-align: center;
}

.intl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    min-height: 22px;
}

.intl-label {
    font-size: 12px;
    color: #94a3b8;
    flex-shrink: 0;
}

.intl-number {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    flex: 1;
    letter-spacing: 0.01em;
}

.copy-btn {
    display: none;
    align-items: center;
    gap: 4px;
    border: 1px solid #e2e8f0;
    background: #fff;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 12px;
    color: #64748b;
    cursor: pointer;
    transition: all 0.12s;
    flex-shrink: 0;
    font-family: inherit;
}

.copy-btn:hover {
    border-color: #6366f1;
    color: #6366f1;
}

.copy-btn.copied {
    border-color: #10b981;
    color: #10b981;
}

.payment-method {
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}

.payment-method:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
}

</style>


<script>

function flag(code) {
    return [...code.toUpperCase()]
        .map(c =>
            String.fromCodePoint(c.charCodeAt(0) + 127397)
        )
        .join('');
}


const countries = [

    { code: 'JO', name: 'Jordan', dial: '+962', pattern: '## ### ####', maxLen: 9 },
    { code: 'SA', name: 'Saudi Arabia', dial: '+966', pattern: '## ### ####', maxLen: 9 },
    { code: 'CA', name: 'Canada', dial: '+1', pattern: '(###) ###-####', maxLen: 10 },
    { code: 'US', name: 'United States', dial: '+1', pattern: '(###) ###-####', maxLen: 10 },
    { code: 'GB', name: 'United Kingdom', dial: '+44', pattern: '#### ### ####', maxLen: 10 },
    { code: 'DE', name: 'Germany', dial: '+49', pattern: '### #######', maxLen: 10 },
    { code: 'FR', name: 'France', dial: '+33', pattern: '# ## ## ## ##', maxLen: 10 },
    { code: 'IN', name: 'India', dial: '+91', pattern: '##### #####', maxLen: 10 },
    { code: 'AU', name: 'Australia', dial: '+61', pattern: '### ### ###', maxLen: 9 },
    { code: 'NL', name: 'Netherlands', dial: '+31', pattern: '## ### ####', maxLen: 9 },
    { code: 'PL', name: 'Poland', dial: '+48', pattern: '### ### ###', maxLen: 9 },
    { code: 'ES', name: 'Spain', dial: '+34', pattern: '### ### ###', maxLen: 9 },
    { code: 'IT', name: 'Italy', dial: '+39', pattern: '### ### ####', maxLen: 10 },
    { code: 'BR', name: 'Brazil', dial: '+55', pattern: '(##) #####-####', maxLen: 11 },
    { code: 'JP', name: 'Japan', dial: '+81', pattern: '##-####-####', maxLen: 10 },
    { code: 'CN', name: 'China', dial: '+86', pattern: '### #### ####', maxLen: 11 },
    { code: 'AE', name: 'UAE', dial: '+971', pattern: '## ### ####', maxLen: 9 },
    { code: 'SE', name: 'Sweden', dial: '+46', pattern: '##-### ## ##', maxLen: 9 },
    { code: 'NO', name: 'Norway', dial: '+47', pattern: '### ## ###', maxLen: 8 },
    { code: 'DK', name: 'Denmark', dial: '+45', pattern: '## ## ## ##', maxLen: 8 },
    { code: 'CH', name: 'Switzerland', dial: '+41', pattern: '## ### ## ##', maxLen: 9 },
    { code: 'BE', name: 'Belgium', dial: '+32', pattern: '### ## ## ##', maxLen: 9 },
    { code: 'EG', name: 'Egypt', dial: '+20', pattern: '### ### ####', maxLen: 10 },
    { code: 'TR', name: 'Turkey', dial: '+90', pattern: '### ### ## ##', maxLen: 10 },
    { code: 'PK', name: 'Pakistan', dial: '+92', pattern: '### #######', maxLen: 10 },
    { code: 'KR', name: 'South Korea', dial: '+82', pattern: '## #### ####', maxLen: 10 },
    { code: 'MX', name: 'Mexico', dial: '+52', pattern: '## #### ####', maxLen: 10 },
    { code: 'ID', name: 'Indonesia', dial: '+62', pattern: '### #### ####', maxLen: 10 },
    { code: 'MY', name: 'Malaysia', dial: '+60', pattern: '## ### ####', maxLen: 9 },
    { code: 'SG', name: 'Singapore', dial: '+65', pattern: '#### ####', maxLen: 8 },
    { code: 'NZ', name: 'New Zealand', dial: '+64', pattern: '## ### ####', maxLen: 9 },
    { code: 'ZA', name: 'South Africa', dial: '+27', pattern: '## ### ####', maxLen: 9 },
    { code: 'NG', name: 'Nigeria', dial: '+234', pattern: '### ### ####', maxLen: 10 },
    { code: 'AR', name: 'Argentina', dial: '+54', pattern: '## #### ####', maxLen: 10 },
    { code: 'CL', name: 'Chile', dial: '+56', pattern: '# #### ####', maxLen: 9 },
    { code: 'CO', name: 'Colombia', dial: '+57', pattern: '### ### ####', maxLen: 10 },
    { code: 'PE', name: 'Peru', dial: '+51', pattern: '### ### ###', maxLen: 9 },
    { code: 'PT', name: 'Portugal', dial: '+351', pattern: '### ### ###', maxLen: 9 },
    { code: 'AT', name: 'Austria', dial: '+43', pattern: '### #######', maxLen: 10 },
    { code: 'GR', name: 'Greece', dial: '+30', pattern: '### ### ####', maxLen: 10 },
    { code: 'RU', name: 'Russia', dial: '+7', pattern: '### ###-##-##', maxLen: 10 },
    { code: 'UA', name: 'Ukraine', dial: '+380', pattern: '## ### ## ##', maxLen: 9 },
    { code: 'IE', name: 'Ireland', dial: '+353', pattern: '## ### ####', maxLen: 9 },
    { code: 'HK', name: 'Hong Kong', dial: '+852', pattern: '#### ####', maxLen: 8 },
    { code: 'PH', name: 'Philippines', dial: '+63', pattern: '### ### ####', maxLen: 10 },
    { code: 'VN', name: 'Vietnam', dial: '+84', pattern: '### ### ####', maxLen: 9 }

].map(country => ({
    ...country,
    flag: flag(country.code)
}));


let selectedCountry = countries.find(
    country => country.code === 'SA'
) || countries[0];

let dropdownOpen = false;
let filteredList = [...countries];


function init() {

    document.getElementById('trigger-flag').textContent =
        selectedCountry.flag;

    document.getElementById('trigger-dial').textContent =
        selectedCountry.dial;

    document.getElementById('phone-input').placeholder =
        selectedCountry.pattern.replace(/#/g, '0');

    renderList(countries);

    updateIntl('');

}


function toggleDropdown() {

    dropdownOpen = !dropdownOpen;

    const dropdown = document.getElementById('dropdown');
    const trigger = document.getElementById('country-trigger');

    dropdown.classList.toggle('open', dropdownOpen);
    trigger.classList.toggle('open', dropdownOpen);

    trigger.setAttribute(
        'aria-expanded',
        String(dropdownOpen)
    );

    if (dropdownOpen) {

        document.getElementById('search-input').value = '';

        filterCountries('');

        setTimeout(() => {
            document.getElementById('search-input').focus();
        }, 60);

    }

}


function closeDropdown() {

    if (!dropdownOpen) {
        return;
    }

    dropdownOpen = false;

    document
        .getElementById('dropdown')
        .classList.remove('open');

    document
        .getElementById('country-trigger')
        .classList.remove('open');

    document
        .getElementById('country-trigger')
        .setAttribute('aria-expanded', 'false');

}


function selectCountry(code) {

    selectedCountry =
        countries.find(country => country.code === code) ||
        countries[0];

    document.getElementById('trigger-flag').textContent =
        selectedCountry.flag;

    document.getElementById('trigger-dial').textContent =
        selectedCountry.dial;

    document.getElementById('phone-input').placeholder =
        selectedCountry.pattern.replace(/#/g, '0');

    const raw =
        document
            .getElementById('phone-input')
            .value
            .replace(/\D/g, '');

    closeDropdown();

    const formatted =
        formatPhone(
            raw,
            selectedCountry.pattern
        );

    document.getElementById('phone-input').value =
        formatted;

    validate(raw);
    updateIntl(raw);
    renderList(filteredList);

    document.getElementById('phone-input').focus();

}


function formatPhone(digits, pattern) {

    let index = 0;

    return pattern
        .replace(/#/g, () => digits[index++] || '')
        .replace(/[^0-9]+$/, '');

}


function handleInput(value) {

    const digits =
        value
            .replace(/\D/g, '')
            .slice(0, selectedCountry.maxLen);

    const formatted =
        formatPhone(
            digits,
            selectedCountry.pattern
        );

    document.getElementById('phone-input').value =
        formatted;

    validate(digits);
    updateIntl(digits);

}


function validate(digits) {

    const icon =
        document.getElementById('status-icon');

    if (!digits.length) {
        icon.textContent = '';
        return;
    }

    icon.textContent =
        digits.length === selectedCountry.maxLen
            ? '✓'
            : '✕';

}


function updateIntl(digits) {

    const intlElement =
        document.getElementById('intl-number');

    const copyButton =
        document.getElementById('copy-btn');

    if (!digits || !digits.length) {

        intlElement.textContent = '--';
        copyButton.style.display = 'none';

        return;
    }

    const spaced =
        digits.replace(
            /(\d{3})(?=\d)/g,
            '$1 '
        );

    intlElement.textContent =
        selectedCountry.dial + ' ' + spaced;

    copyButton.style.display = 'flex';

}


function filterCountries(query) {

    const q =
        query.trim().toLowerCase();

    filteredList = q
        ? countries.filter(country =>
            country.name.toLowerCase().includes(q) ||
            country.dial
                .replace('+', '')
                .includes(q.replace('+', '')) ||
            country.code.toLowerCase().includes(q)
        )
        : [...countries];

    renderList(filteredList);

}


function renderList(list) {

    const container =
        document.getElementById('country-list');

    if (!list.length) {

        container.innerHTML =
            '<div class="no-results">No countries found</div>';

        return;
    }

    container.innerHTML =
        list.map(country => `
            <div
                class="country-item${country.code === selectedCountry.code ? ' selected' : ''}"
                role="option"
                data-code="${country.code}"
                aria-selected="${country.code === selectedCountry.code}"
            >

                <span class="country-flag">
                    ${country.flag}
                </span>

                <span class="country-name">
                    ${country.name}
                </span>

                <span class="country-code">
                    ${country.dial}
                </span>

            </div>
        `).join('');

    container
        .querySelectorAll('.country-item')
        .forEach(element => {

            element.addEventListener(
                'click',
                () => selectCountry(element.dataset.code)
            );

        });

}


function copyNumber() {

    const text =
        document.getElementById('intl-number').textContent;

    if (!text || text === '--') {
        return;
    }

    const plain =
        text.replace(/\s/g, '');

    function onCopied() {

        const button =
            document.getElementById('copy-btn');

        const label =
            document.getElementById('copy-label');

        button.classList.add('copied');
        label.textContent = 'Copied!';

        setTimeout(() => {

            button.classList.remove('copied');
            label.textContent = 'Copy';

        }, 1800);

    }

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(plain)
            .then(onCopied)
            .catch(() => fallbackCopy(plain, onCopied));

    } else {

        fallbackCopy(plain, onCopied);

    }

}


function fallbackCopy(text, callback) {

    const textarea =
        document.createElement('textarea');

    textarea.value = text;

    textarea.style.cssText =
        'position:fixed;opacity:0';

    document.body.appendChild(textarea);

    textarea.select();

    try {
        document.execCommand('copy');
    } catch (e) {
        console.log(e);
    }

    document.body.removeChild(textarea);

    callback();

}


document
    .getElementById('country-trigger')
    .addEventListener('click', toggleDropdown);


document
    .getElementById('phone-input')
    .addEventListener(
        'input',
        event => handleInput(event.target.value)
    );


document
    .getElementById('search-input')
    .addEventListener(
        'input',
        event => filterCountries(event.target.value)
    );


document
    .getElementById('copy-btn')
    .addEventListener(
        'click',
        copyNumber
    );


document.addEventListener('click', event => {

    if (
        dropdownOpen &&
        !event.target.closest('#phone-wrap')
    ) {
        closeDropdown();
    }

});
  

init();
