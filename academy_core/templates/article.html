{% extends 'base.html' %}

{% block content %}

<div class="container my-5">
    <article class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">

            <h1 class="card-title display-5 fw-bold mb-3">
                {{ article.title }}
            </h1>

            <p class="lead text-muted mb-4">
                {{ article.description }}
            </p>

            <hr class="mb-4">

            <div class="fs-5 lh-lg">
                {{ article.content }}
            </div>

            <div class="mt-5 pt-3 border-top text-muted">
                <small>
                    Published on {{ article.created_at|date:"F d, Y" }}
                </small>
            </div>

        </div>
    </article>
</div>

{% endblock %}
