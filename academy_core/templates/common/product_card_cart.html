{% load i18n %}
{% load my_filters %}

<div style='border: solid 1px #ccc;'>
    <div class="product card "onclick="window.location.href='{% url 'store.product' product.id %}'"style="cursor: pointer;">


        <img src="{{ product.image.url }}" class="card-img-top" alt="..." />

        <div class="card-img-overlay">
            
        </div>
        
        <br>    
    </div>
    <hr>
    <div style="cursor: text !important;" class="card-body">
        <h6 class="text-muted">{{ product.author.name }}</h6>
        <h6 class="card-title">{{ product.name }}</h6>
        <strong class="fw-bold text-success">{{ product.price|currency }}</strong>
    </div>
</div>


<style>
.card-img-overlay > a {
    width: fit-content !important;
    right: 0 !important;
    left: auto !important;
}

.card-img-overlay:hover {
    background: rgba(0, 0, 0, 0.095);
    border: solid 3px rgba(0, 0, 0, 0.595);
}
.product-card .card-img-top {
    width: 100%;
    height: 220px;
    object-fit: contain;
}
.product .card-img-top {
    width: 100%;
    height: 220px;
    object-fit: contain;

}

</style>
