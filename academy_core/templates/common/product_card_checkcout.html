{% load i18n %}
{% load my_filters %}

<div class="product card mb-4"
     onclick="window.location.href='{% url 'store.product' product.id %}'"
     style="cursor: pointer;">

    <img src="{{ product.image.url }}" class="card-img-top" alt="..." />

    <div class="card-img-overlay">
        </div>

    <div class="card-body">
        <div class="mt-3">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted">Price</span>
                <strong id="{{ product.id }}" class="fw-bold text-success">
                    {{ product.price|currency }}
                </strong>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted">Quantity</span>
                {% with cart_item=cart_model.items|get_item:product.id %}
                    <strong>{{ cart_item.quantity }}</strong>
                {% endwith %}
            </div>

            <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                <span class="fw-semibold">Total price</span>
                {% with cart_item=cart_model.items|get_item:product.id %}
                    <strong class="fw-bold text-primary">
                        {{ cart_item.total_price|currency }}
                    </strong>
                {% endwith %}
            </div>

        </div>
    </div>

</div>

<style>
.card-img-overlay > a {
    width: fit-content !important;
    right: 0 !important;
    left: auto !important;
}

.card-img-overlay:hover {
    background: rgba(0, 0, 0, 0.095);
    border: solid 3px rgba(0, 0, 0, 0.595);
}
.product-card .card-img-top {
    width: 100%;
    height: 220px;
    object-fit: contain;
}
.product .card-img-top {
    width: 100%;
    height: 220px;
    object-fit: contain;
}

</style>
