                  <form  class="message_send_form">
                    {% csrf_token %}
                    <div id="ai_messages_container">
                    {% include 'ai_messages.html' with messages=messages %}
                    </div>
                    <div class="input-wrapper">

                        <input type="text" id="ai_message"  name="message" placeholder="Write a message..." autocomplete="off" required>

                        <button type="button" id="send_btn_ai">
                            <i class="lni lni-telegram-original"></i>
                        </button>
                    </div>




































                    <script>

                                            

                    const inputField = document.getElementById('ai_message');
                    const send_btn_ai = document.getElementById("send_btn_ai");


                    inputField.addEventListener("keydown", function (e) {

                        if (e.key === "Enter") {
                            e.preventDefault(); 
                            

                            send_btn_ai.click();
                        }
                    });
                      send_btn_ai.addEventListener("click", async function (e) {
                          e.preventDefault();
                          
                          
                          const form = this.closest('.message_send_form');
                          const input = form.querySelector('input[name="message"]');
                          const message = input.value.trim();
                          const lesson_id = document.getElementById("lesson_id").dataset.lesson_id;
                          
                          
                          if (!message) {
                              return;
                          }
                          
                          
                          
                          const messagesContainer = document.getElementById("ai_messages_container");

                          if (!messagesContainer) {
                              console.error("Could not find the messages container! Make sure a div with id='ai_messages_container' exists");
                              return; 
                          }

                          console.log("SEND CLICK");

                          
                          
                          
                          const userMessageElement = document.createElement("div");
                          userMessageElement.classList.add("message-row", "message-user"); 
                          userMessageElement.innerHTML = `<div class="message-bubble"><div class="message-text">${message}</div></div>`;
                          messagesContainer.appendChild(userMessageElement);

                          
                          input.value = "";

                          
                          
                          
                          const aiMessageElement = document.createElement("div");
                          
                          aiMessageElement.classList.add("message-row", "message-ai"); 
                          aiMessageElement.innerHTML = `<div class="message-bubble" style="background:#f1f3f5; color:#000;"><div class="message-text"></div></div>`;
                          messagesContainer.appendChild(aiMessageElement);
                          const formDataToSend = new FormData(form);


                          formDataToSend.append("message", message);
                          formDataToSend.append("lesson_id", lesson_id);
                          
                          const aiTextContainer = aiMessageElement.querySelector(".message-text");

                          
                          messagesContainer.scrollTop = messagesContainer.scrollHeight;

                          try {
                              const response = await fetch("/ai/sendaimessage/", {
                                  method: "POST",
                                  headers: {
                                      "X-CSRFToken": form.querySelector('input[name="csrfmiddlewaretoken"]').value
                                  },
                                  body:formDataToSend
                              });
                              
                              if (!response.ok) {
                                  throw new Error(`HTTP error: ${response.status}`);
                              }

                              if (!response.body) {
                                  throw new Error("Streaming is not supported by this response.");
                              }

                              const reader = response.body.getReader();
                              const decoder = new TextDecoder();
                              let fullResponse = "";

                              while (true) {
                                  const { value, done } = await reader.read();
                                  if (done) break;
                                  
                                  const chunk = decoder.decode(value, { stream: true });
                                  fullResponse += chunk;

                                  
                                  aiTextContainer.textContent = fullResponse;

                                  
                                  messagesContainer.scrollTop = messagesContainer.scrollHeight;
                              }

                              
                              fullResponse += decoder.decode();
                              console.log("Completed:", fullResponse);

                          } catch (error) {
                              console.error("Streaming error:", error);
                              aiTextContainer.textContent = "{% trans 'An error occurred while fetching the response.' %}";
                          }
                      });
                    </script>
