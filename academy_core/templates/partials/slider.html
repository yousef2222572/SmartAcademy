<!-- Added class="swiper" to avoid dragging problems -->
<div class="swiper main-slider my-auto" dir="ltr">
      
      <div class="swiper-wrapper">
        <!-- Slides -->
          {% for slide in courses %}
            <div class="swiper-slide">
              <div class="container pt-5">
                <div class="row">
                  <div class="col-md-4 text-center d-none d-lg-block">
                    <img src="{{ slide.image.url }}" alt="{{ slide.course_title }}" class="img-fluid rounded" />
                  </div>
                  <div class="col-md-8">
                    <h1 class="text-secondary">{{ slide.course_title }}</h1>
                    <blockquote class="blockquote mt-4">
                      <p class="text-muted">{{ slide.course_description }}</p>
                    </blockquote>
                  </div>
                </div>
              </div>
            </div>
          {% endfor %}
      </div>
</div>


<script>
  document.addEventListener("DOMContentLoaded", function () {
    const swiper = new Swiper('.main-slider', {
      loop: true,          
      autoplay: {
        delay: 4000,       
        disableOnInteraction: false, 
      },
    });
  });
</script>
